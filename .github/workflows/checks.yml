name: Code and evidence checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      # CPU wheel of the existing Torch pin; no CUDA runtime is needed by these tests.
      # https://pytorch.org/get-started/previous-versions/#v251
      - name: Install pinned environment
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip check
      - name: Check code and evidence without research data
        run: python scripts/check_repo.py
