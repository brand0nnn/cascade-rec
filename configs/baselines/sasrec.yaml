model: SASRec           # Kang & McAuley (2018): original recipe, BCE with 1 random negative per position
train_on: all_train      # main setting; also run with --train-on retriever_train (RQ1)
early_stop_val_subset: 20000
recbole:
  n_layers: 2
  n_heads: 1
  hidden_size: 64
  inner_size: 64              # original SASRec point-wise FFN is d x d
  hidden_dropout_prob: 0.2
  attn_dropout_prob: 0.2
  hidden_act: relu
  layer_norm_eps: 1.0e-8
  initializer_range: 0.02
  loss_type: BPR              # makes RecBole sample 1 negative; SASRecBCE replaces the loss by BCE
  train_neg_sample_args: {distribution: uniform, sample_num: 1}
  learner: adam
  learning_rate: 0.001
  train_batch_size: 512
  eval_batch_size: 1024
  epochs: 200
  eval_step: 1
  stopping_step: 5
  weight_decay: 0.0
