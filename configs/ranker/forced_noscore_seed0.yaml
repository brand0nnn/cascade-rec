# Exploratory (2026-10-28): matching features WITHOUT the retrieval-score input; all training lists (forced included).
model: mlp
history_length: 50
item_text_dim: 384
hidden_dims:
- 256
- 128
- 64
dropout: 0.1
loss: binary_cross_entropy
optimizer: adam
learning_rate: 0.001
batch_size: 2048
max_epochs: 30
early_stopping:
  metric: ndcg@10_macro
  patience: 3
negative_sampling:
  negatives_per_list: 50
  strategy: uniform_without_replacement
seed: 0
experiment: forced_noscore
feature_groups:
- matching
k1: 200
