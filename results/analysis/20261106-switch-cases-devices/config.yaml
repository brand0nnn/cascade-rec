generation_rules:
  iphone: line iphone; gen = IPHONE_GEN (variant suffix ignored; plain SE unordered)
  galaxy_s: line galaxy_s; gen = number (S2..S9 < S10 < S20 < S21 ...)
  galaxy_note: line galaxy_note; gen = number
  galaxy_a: unordered
  galaxy_z_flip: line z_flip; gen = number (none -> 1)
  galaxy_z_fold: line z_fold; gen = number (none -> 1)
  pixel: line pixel; gen = number + 0.5 if a (XL/Pro ignored; bare "Pixel XL" -> 1)
  apple_watch: line apple_watch; gen = series number; Ultra = 8, Ultra 2 = 9; SE unordered
  fitbit: line fitbit:<line>; gen = number (none -> 1)
company:
  iphone: apple
  apple_watch: apple
  galaxy_s: samsung
  galaxy_note: samsung
  galaxy_a: samsung
  galaxy_z_flip: samsung
  galaxy_z_fold: samsung
  pixel: google
  fitbit: fitbit
multi_rule: target is "specific" if it names <= 3 model keys from exactly 1 family; otherwise "multi" (likely universal list)
not_parsed: iPad, Galaxy Tab/Watch/Buds, other brands -> none; bare Galaxy/Samsung is not a family mention
definitions:
  T: model keys parsed from the target title
  H: union of model keys over ALL prior history titles (positions < hist_len)
  Hfam: families from H keys plus bare family mentions in history titles
  L: model keys of the last history product
  categories (events with T non-empty):
  - 'model_in_history: T & H non-empty'
  - 'same_family_other_model: T & H empty and a T family in Hfam'
  - 'new_family_history_names_no_device: Hfam empty'
  - 'new_family_same_company: no shared family, a shared company'
  - 'new_family_other_company: otherwise'
  generation (same_family_other_model only): per shared comparable line compare max target gen vs history max gen; all newer
    -> newer, all older -> older, all equal -> same_generation, mixed -> mixed, no comparable line -> incomparable
  top10 slots: 'each of recency top10 and two-tower cand[:10]: echo = slot keys & H non-empty; other_model = keys non-empty
    and disjoint from H; no_model. Also: slot names a target key (events with T non-empty).'
  audit_sample: 60 items with >=1 model key, drawn with default_rng(0) from sorted item ids, for human review
hypothesis: Among double-miss events whose target title names a recognisable device model, a majority (>50%) name a model
  never named in the user history titles, and this share is clearly higher than among events retrieved by at least one retriever.
  Among those, the named model is more often newer than the history's latest-named model of the same family.
hypothesis_operational: part 1 holds if share(T & H empty | T non-empty) > 0.5 among double misses AND exceeds the retrieved
  share by >= 0.10 absolute; part 2 holds if, among same_family_other_model double misses with an ordered verdict, newer >
  older
