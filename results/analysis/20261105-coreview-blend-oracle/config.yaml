scope: Val only, exploratory; regenerated pipeline
registered_at: '2026-11-05T04:58:37+08:00'
hypothesis: 'Pre-registered: the candidate-level blend keeps BCE''s warm quality and
  recovers part of pairwise''s new-item advantage, beating each component overall
  by a small margin; the target-conditioned oracle gap is much larger than the blend
  gain.'
parent_study: results/local_experiments/20261103-full-promising-ranking
factorial_study: results/local_experiments/20261104-objective-coreview
