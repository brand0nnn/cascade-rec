model: SASRec
train_on: AB
early_stop_val_subset: 20000
recbole:
  data_path: /Users/brandonkang/nus/cp4285/project/data/processed/recbole
  dataset: sequential_AB_v20000
  benchmark_filename:
  - train
  - valid
  - test
  field_separator: "\t"
  seq_separator: ' '
  USER_ID_FIELD: user_id
  ITEM_ID_FIELD: item_id
  TIME_FIELD: timestamp
  load_col:
    inter:
    - user_id
    - item_id
    - timestamp
    - item_id_list
    item:
    - item_id
  eval_args:
    split:
      RS:
      - 0.8
      - 0.1
      - 0.1
    order: TO
    group_by: user
    mode: full
  metrics:
  - Recall
  - NDCG
  topk:
  - 10
  - 100
  valid_metric: Recall@100
  reproducibility: true
  show_progress: false
  save_dataset: false
  save_dataloaders: false
  log_wandb: false
  alias_of_item_id:
  - item_id_list
  MAX_ITEM_LIST_LENGTH: 50
  n_layers: 2
  n_heads: 1
  hidden_size: 64
  inner_size: 64
  hidden_dropout_prob: 0.2
  attn_dropout_prob: 0.2
  hidden_act: relu
  layer_norm_eps: 1.0e-08
  initializer_range: 0.02
  loss_type: BPR
  train_neg_sample_args:
    distribution: uniform
    sample_num: 1
    alpha: 1.0
    dynamic: false
    candidate_num: 0
  learner: adam
  learning_rate: 0.001
  train_batch_size: 512
  eval_batch_size: 1024
  epochs: 200
  eval_step: 1
  stopping_step: 5
  weight_decay: 0.0
  seed: 2
  checkpoint_dir: /Users/brandonkang/nus/cp4285/project/results/baselines/SASRec_AB/seed2/checkpoint
  use_gpu: false
seed: 2
toy: false
